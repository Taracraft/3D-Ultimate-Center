[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ultimate-3d-printing-studio-core"
version = "6.0.0b3"
description = "Core domain and API contracts for Ultimate 3D Printing Studio V6"
requires-python = ">=3.12"
authors = [
  { name = "3D-Printer Control Center Contributors" }
]
dependencies = [
  "aiohttp>=3.11,<4"
]

[project.optional-dependencies]
test = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25"
]

[project.scripts]
ultimate-3d-studio-api = "api.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_mode = "auto"
