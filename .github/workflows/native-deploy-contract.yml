name: Native Deploy Contract

on:
  push:
    branches: [sync/studio-release-20261005]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-deployment-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify reviewed source hashes
        run: |
          echo '5fcb1f8eba35faf5897e21630aa23f42c9fe09ab1dcaa55ffe4905c7835e1697  slicing-server/deploy-native-slicer.sh' | sha256sum -c -
          echo '3c743c46d9e8d795912eca8f0a4d9ebd9f3ba7abb3124c3a3af1ba5642b9cbad  studio-v6/tests/test_native_deploy_supervisor.py' | sha256sum -c -
          bash -n slicing-server/deploy-native-slicer.sh
      - name: Install isolated test dependency
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<10'
      - name: Test synthetic deployment lifecycle without real services
        run: |
          command -v jq
          mkdir -p .native-deploy-evidence
          sudo -n env NATIVE_DEPLOY_SOURCE="$GITHUB_WORKSPACE/slicing-server/deploy-native-slicer.sh" "$(command -v python)" -m pytest --noconftest -q studio-v6/tests/test_native_deploy_supervisor.py --junitxml="$GITHUB_WORKSPACE/.native-deploy-evidence/junit.xml"
      - name: Require all lifecycle cases to have run
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = list(ET.parse('.native-deploy-evidence/junit.xml').getroot().iter('testsuite'))
          assert sum(int(s.get('tests', 0)) for s in suites) == 26
          for key in ('failures', 'errors', 'skipped'):
              assert sum(int(s.get(key, 0)) for s in suites) == 0, key
          print('26 isolated deployment tests passed; no production deployment performed')
          PY
          git rev-parse HEAD > .native-deploy-evidence/commit.txt
          sha256sum slicing-server/deploy-native-slicer.sh studio-v6/tests/test_native_deploy_supervisor.py > .native-deploy-evidence/source.sha256
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-deployment-contract-evidence
          path: .native-deploy-evidence/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
