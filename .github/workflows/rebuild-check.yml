name: Rebuild Check

on:
  push:
    branches: [main, "p1/**"]
  pull_request:
    branches: [main, "p1/**"]

permissions:
  contents: read

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Compile Python sources
        run: |
          python -m compileall -q studio/core studio/api
          python -m compileall -q homeassistant/custom_components/ultimate_3d_studio
          python -m compileall -q homeassistant/custom_components/printer_control_center
          python -m compileall -q homeassistant/custom_components/printer_slicing_server
          python -m compileall -q slicing-server
      - name: Install frontend dependencies
        working-directory: studio
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck frontend
        working-directory: studio
        run: npm run typecheck
      - name: Build frontend
        working-directory: studio
        run: npm run build
