name: Studio Sync Candidate

on:
  push:
    branches: [sync/studio-release-20261005]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  makerworld-source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify exact reviewed source identities
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path.cwd()
          count = 0
          for name in ('publication-stage-20261005.json', 'publication-palette-stage-20261005.json'):
              record = json.loads((root / 'studio-v6/docs' / name).read_text())
              assert record['full_repository_sync_complete'] is False
              assert record['live_deployed'] is False
              for row in record['files']:
                  path = root / row['public_path']
                  assert path.is_file() and not path.is_symlink(), row['public_path']
                  data = path.read_bytes()
                  assert hashlib.sha256(data).hexdigest() == row['sha256'], row['public_path']
                  assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data, usedforsecurity=False).hexdigest() == row['git_blob_sha'], row['public_path']
                  count += 1
          print('Verified', count, 'reviewed source files; no live deployment')
          PY
      - name: Assemble the existing repository layout for isolated source tests
        run: |
          mkdir -p studio-v6/deploy/homeassistant/custom_components
          test ! -e studio-v6/deploy/homeassistant/custom_components/ultimate_3d_studio_v6
          cp -a homeassistant/custom_components/ultimate_3d_studio_v6 studio-v6/deploy/homeassistant/custom_components/
      - name: Install isolated Python test dependencies
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<10' 'aiohttp>=3.9,<4' 'yarl>=1,<2'
      - name: Test actual MakerWorld and palette paths plus source identity
        working-directory: studio-v6
        run: python -m pytest -q tests/test_makerworld_transfer_contract.py tests/test_toolpath_palette_integrity.py tests/test_source_fingerprint.py --junitxml=.test-results/publication-junit.xml
      - name: Install locked TypeScript toolchain without package scripts
        working-directory: studio-v6
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Strictly compile the shared palette helper
        working-directory: studio-v6
        run: node node_modules/typescript/bin/tsc frontend/toolpath-material-colors.ts --strict --skipLibCheck --target ES2022 --module ES2022 --noEmitOnError --outDir .test-results/palette
      - name: Check actual compiled palette behavior
        working-directory: studio-v6
        run: |
          node --input-type=module > .test-results/palette-node.log <<'JS'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { normalizeToolpathPalette, toolpathMaterialColor, toolpathPaletteWarning } from './.test-results/palette/toolpath-material-colors.js';
          for (const color of ['#ff0000', '#ffffff', '#fbff00', '#000000']) {
            test('exact job color ' + color, () => assert.equal(toolpathMaterialColor([color], 0), color));
          }
          test('missing entries never shift subsequent channels', () => {
            assert.deepEqual(normalizeToolpathPalette(['#FF0000', null, '#000000']), ['#ff0000', '', '#000000']);
          });
          test('invalid tools never wrap to a real material', () => {
            for (const tool of [-1, 4, 255, 1.5, NaN, '0']) assert.equal(toolpathMaterialColor(['#ff0000'], tool), null);
          });
          test('unknown channels get an explicit warning', () => {
            assert.match(toolpathPaletteWarning([{segments: [[0,0,1,1,.2,3,1]]}], ['#ff0000']), /Kanal 4/);
          });
          test('normalization never mutates the source job palette', () => {
            const original = ['#FF0000', '', '#FFFFFF'];
            normalizeToolpathPalette(original);
            assert.deepEqual(original, ['#FF0000', '', '#FFFFFF']);
          });
          JS
          cat .test-results/palette-node.log
      - name: Preserve the exact tracked public source revision
        run: |
          git archive --format=tar.gz --output=studio-v6/.test-results/public-candidate-source.tar.gz HEAD
          git rev-parse HEAD > studio-v6/.test-results/public-candidate-source.commit
          sha256sum studio-v6/.test-results/public-candidate-source.tar.gz > studio-v6/.test-results/public-candidate-source.sha256
      - name: Retain source-bound test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-source-sync-evidence
          path: |
            studio-v6/.test-results/publication-junit.xml
            studio-v6/.test-results/palette-node.log
            studio-v6/.test-results/public-source-fingerprints.json
            studio-v6/.test-results/public-transfer-fingerprints.json
            studio-v6/.test-results/public-candidate-source.tar.gz
            studio-v6/.test-results/public-candidate-source.commit
            studio-v6/.test-results/public-candidate-source.sha256
          if-no-files-found: error
          retention-days: 7
