name: Studio P1 Source Integrity

on:
  push:
    branches: [main, "p1/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate reviewed PC source identities and protected V5 tree
        shell: bash
        run: |
          mkdir -p .p1-evidence
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path
          root = Path.cwd()
          record = json.loads((root / ".github/p1-public-source-sha256.json").read_text(encoding="utf-8"))
          assert record["format"] == "tara-studio-p1-public-source-identity-v1"
          assert record["base_commit"] == "7f69fd44101f9984d106205489f399286419b566"
          expected_v5 = record["protected_v5_tree"]
          actual_v5 = subprocess.check_output(
              ["git", "rev-parse", "HEAD:homeassistant/custom_components/printer_control_center"],
              text=True,
          ).strip()
          assert actual_v5 == expected_v5, ("protected_v5_tree_modified", actual_v5)
          entries = record["entries"]
          assert len(entries) == 846, len(entries)
          unique = set()
          for row in entries:
              relative = Path(row["path"])
              assert not relative.is_absolute() and ".." not in relative.parts
              assert row["path"] not in unique, row["path"]
              unique.add(row["path"])
              path = root / relative
              assert path.is_file() and not path.is_symlink(), row["path"]
              data = path.read_bytes()
              assert len(data) == row["size_bytes"], row["path"]
              assert hashlib.sha256(data).hexdigest() == row["sha256"], row["path"]
              actual_blob = hashlib.sha1(
                  b"blob " + str(len(data)).encode("ascii") + b"\0" + data,
                  usedforsecurity=False,
              ).hexdigest()
              assert actual_blob == row["git_blob_sha"], row["path"]
          for prefix in (
              "studio/",
              "homeassistant/custom_components/ultimate_3d_studio/",
              "homeassistant/www/3d-studio/",
          ):
              expected = {p for p in unique if p.startswith(prefix)}
              directory = root / prefix
              actual = {
                  p.relative_to(root).as_posix()
                  for p in directory.rglob("*") if p.is_file()
              }
              assert actual == expected, ("public_scope_extra_or_missing", prefix, sorted(actual ^ expected)[:20])
          old_active_paths = (
              "studio-v6",
              "homeassistant/custom_components/ultimate_3d_studio_v6",
              "homeassistant/www/3d-studio-v6",
              ".github/workflows/recover-canonical-v6.yml",
          )
          if (root / ".github/p1-finalized.txt").is_file():
              assert all(not (root / p).exists() for p in old_active_paths), "active V6 paths remain after finalization"
              print("P1 finalized: old active namespaces absent")
          else:
              print("P1 transitional candidate: retirement awaits first green CI")
          assert not (root / "studio/deploy/homeassistant/custom_components/ultimate_3d_studio_v6").exists()
          assert not (root / "studio/deploy/homeassistant/www/3d-studio-v6").exists()
          print("Verified", len(entries), "PC-identical public files and unchanged V5 tree")
          PY
          git rev-parse HEAD > .p1-evidence/commit.txt
          sha256sum .github/p1-public-source-sha256.json > .p1-evidence/source-manifest.sha256
      - name: Validate isolated native worker source package without deploying
        shell: bash
        run: |
          bash -n scripts/rebuild-homeassist.sh
          cmp scripts/rebuild-homeassist.sh studio/scripts/rebuild-homeassist.sh
          python studio/tools/studio_linux_preflight.py --source-root "$GITHUB_WORKSPACE" --layout public --check > .p1-evidence/native-package.json
          python - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path('.p1-evidence/native-package.json').read_text())
          assert doc["success"] and doc["file_count"] == 27
          assert doc["installation_performed"] is False
          assert doc["services_started"] is False
          assert doc["package_sha256"] == "933f63ef7d4eb08d0b78ef9057fd2eed5ed115e747812b41c369632ee76a43f8"
          PY
      - name: Preserve read-only source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-p1-source-identity
          path: .p1-evidence/
          if-no-files-found: warn
          retention-days: 7

  isolated-source-regressions:
    needs: exact-source-identity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install locked frontend dependencies
        working-directory: studio
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck canonical Studio frontend
        working-directory: studio
        run: npm run typecheck
      - name: Run source-owned logic tests (no printer access)
        working-directory: studio
        run: node run_frontend_logic_tests.mjs
      - name: Validate production frontend build
        working-directory: studio
        run: npm run build
      - name: Install isolated Python test dependencies
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<10' 'pytest-asyncio>=0.25,<2' 'aiohttp>=3.11,<4' 'yarl>=1,<2'
      - name: Check P1 naming and functional source contracts
        working-directory: studio
        run: |
          python -m pytest -q tests/test_p1_active_namespace.py tests/test_source_fingerprint.py tests/test_makerworld_transfer_contract.py tests/test_toolpath_palette_integrity.py tests/test_http_server.py tests/test_http_contract_errors.py tests/test_viewer_modal_node_contract.py
      - name: Compile canonical Python and HA component sources
        run: |
          python -m compileall -q studio/core studio/api
          python -m compileall -q homeassistant/custom_components/ultimate_3d_studio
