<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D-Printer Slicing Server</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#111b2e;--panel2:#17233a;--line:#2a3a57;--text:#eef4ff;--muted:#9dafc8;--accent:#43b5ff;--ok:#3ddc97;--warn:#ffc857;--bad:#ff6b6b}*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#08101d,#101a2d 60%,#0a1323);color:var(--text)}header{padding:22px 28px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;justify-content:space-between;background:#0d1728dd;position:sticky;top:0;z-index:5;backdrop-filter:blur(10px)}h1{font-size:20px;margin:0}main{max-width:1280px;margin:auto;padding:24px;display:grid;grid-template-columns:380px 1fr;gap:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 14px 40px #0003}.stack{display:grid;gap:20px}.status{display:flex;gap:10px;flex-wrap:wrap}.pill{padding:6px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}.pill.ok{color:var(--ok)}label{display:block;margin:12px 0 6px;color:var(--muted)}input,select,button{width:100%;border-radius:9px;border:1px solid var(--line);background:#0c1627;color:var(--text);padding:10px 12px;font:inherit}button{background:linear-gradient(135deg,#168ee5,#3ab8ff);border:0;font-weight:700;cursor:pointer;margin-top:14px}button.secondary{background:var(--panel2);border:1px solid var(--line)}button:disabled{opacity:.45;cursor:not-allowed}.drop{border:2px dashed #355274;border-radius:12px;padding:20px;text-align:center;color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid var(--line);padding:10px 8px;vertical-align:top}th{color:var(--muted);font-weight:600}.state{font-weight:700}.completed{color:var(--ok)}.failed{color:var(--bad)}.queued,.slicing{color:var(--warn)}small,.muted{color:var(--muted)}#message{min-height:22px;margin-top:10px}.error{color:var(--bad)}.success{color:var(--ok)}.actions{display:flex;gap:8px}.actions button{width:auto;margin:0;padding:7px 10px}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:850px){main{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.card{overflow:auto}}
</style>
</head>
<body>
<header><div><h1>3D-Printer Slicing Server</h1><div class="muted">Native universelle Slicing-Anwendung</div></div><div id="status" class="status"></div></header>
<main>
<div class="stack">
<section class="card"><h2>Modell hochladen</h2><div class="drop"><input id="file" type="file" accept=".stl,.3mf,.obj,.amf"><div style="margin-top:8px">STL, 3MF, OBJ oder AMF</div></div><button id="upload">Hochladen</button><div id="uploadMessage"></div></section>
<section class="card"><h2>Slicing-Auftrag</h2><label for="inputFile">Modell</label><select id="inputFile"></select><label for="printer">Druckerprofil</label><select id="printer"></select><label for="engine">Engine</label><select id="engine"><option value="auto">Automatisch</option><option value="bambu_studio">Bambu Studio</option><option value="prusaslicer">PrusaSlicer</option><option value="curaengine">CuraEngine</option></select><label for="format">Ausgabeformat</label><select id="format"><option value="gcode">G-Code</option><option value="3mf">3MF</option></select><label for="jobId">Job-ID (optional)</label><input id="jobId" placeholder="wird automatisch erzeugt"><button id="slice">Slicing starten</button><div id="message"></div></section>
</div>
<div class="stack">
<section class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><h2 style="margin-bottom:4px">Aufträge</h2><div class="muted">Automatische Aktualisierung alle 3 Sekunden</div></div><button class="secondary" id="refresh" style="width:auto;margin:0">Aktualisieren</button></div><div id="jobs"></div></section>
<section class="card"><h2>Modelle</h2><div id="files"></div></section>
</div>
</main>
<script>
const api='';
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function json(path,options={}){const r=await fetch(api+path,options);let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.error||`HTTP ${r.status}`);return data}
async function loadStatus(){const [info,status]=await Promise.all([json('/api/v1/info'),json('/api/v1/status')]);el('status').innerHTML=`<span class="pill ok">${esc(info.status)}</span><span class="pill">Version ${esc(info.version)}</span><span class="pill">Engines ${esc(info.engine_count)}</span><span class="pill">Queue ${esc(status.queued_jobs)}</span>`}
async function loadPrinters(){const data=await json('/api/v1/printers');const items=data.printers||data||[];el('printer').innerHTML=items.map(p=>`<option value="${esc(p.id)}">${esc(p.name||p.id)}</option>`).join('')}
async function loadFiles(){const data=await json('/api/v1/files');const files=data.files||[];el('inputFile').innerHTML=files.length?files.map(f=>`<option value="${esc(f.filename)}">${esc(f.filename)}</option>`).join(''):'<option value="">Keine Modelle vorhanden</option>';el('files').innerHTML=files.length?`<table><thead><tr><th>Datei</th><th>Größe</th><th>Geändert</th></tr></thead><tbody>${files.map(f=>`<tr><td>${esc(f.filename)}</td><td>${(f.size/1024).toFixed(1)} KB</td><td>${new Date(f.modified*1000).toLocaleString()}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Noch keine Modelle hochgeladen.</div>'}
async function loadJobs(){const data=await json('/api/v1/jobs');const jobs=data.jobs||[];el('jobs').innerHTML=jobs.length?`<table><thead><tr><th>Job</th><th>Status</th><th>Engine</th><th>Datei</th><th></th></tr></thead><tbody>${jobs.map(j=>`<tr><td>${esc(j.job_id)}</td><td class="state ${esc(j.status)}">${esc(j.status)}</td><td>${esc(j.engine||'-')}</td><td>${esc(j.input_file||'-')}</td><td><div class="actions">${j.download_url?`<button onclick="location.href='${esc(j.download_url)}'">Download</button>`:''}</div></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Noch keine Aufträge.</div>'}
async function refresh(){try{await Promise.all([loadStatus(),loadPrinters(),loadFiles(),loadJobs()])}catch(e){el('message').className='error';el('message').textContent=e.message}}
el('upload').onclick=async()=>{const f=el('file').files[0];if(!f)return;el('upload').disabled=true;try{await json('/api/v1/files/'+encodeURIComponent(f.name),{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:f});el('uploadMessage').className='success';el('uploadMessage').textContent='Upload abgeschlossen.';await loadFiles()}catch(e){el('uploadMessage').className='error';el('uploadMessage').textContent=e.message}finally{el('upload').disabled=false}};
el('slice').onclick=async()=>{el('slice').disabled=true;const payload={printer_profile:el('printer').value,input_file:el('inputFile').value,engine:el('engine').value,output_format:el('format').value,process_profile:'default',filament_profile:'default'};if(el('jobId').value.trim())payload.job_id=el('jobId').value.trim();try{const r=await json('/api/v1/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});el('message').className='success';el('message').textContent=`Job ${r.job_id} wurde angelegt.`;el('jobId').value='';await loadJobs()}catch(e){el('message').className='error';el('message').textContent=e.message}finally{el('slice').disabled=false}};
el('refresh').onclick=refresh;refresh();setInterval(()=>{loadStatus().catch(()=>{});loadJobs().catch(()=>{})},3000);
</script>
</body>
</html>
